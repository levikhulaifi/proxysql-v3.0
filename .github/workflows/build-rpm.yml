name: Build ProxySQL v3.0 RPM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ProxySQL v3.0
        uses: actions/checkout@v4
        with:
          ref: v3.0
          fetch-depth: 0

      - name: Build AlmaLinux 9 RPM
        run: |
          VERSION=$(git describe --tags --long --abbrev=7)
          echo "Building ProxySQL version: $VERSION"
          make GIT_VERSION_BASE="$VERSION" almalinux9

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: proxysql-v3.0-almalinux9-rpm
          path: binaries/*.rpm
          if-no-files-found: error
